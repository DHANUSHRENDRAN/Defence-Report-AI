<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT | Tactical Intelligence</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="auth-view">
        <div class="auth-card">
            <h1>OSINT Core</h1>
            <p id="auth-subtitle">Secure Gateway. Authenticate to proceed.</p>
            <input type="email" id="email" class="auth-input" placeholder="OPERATIVE EMAIL">
            <input type="password" id="password" class="auth-input" placeholder="PASSPHRASE">
            <button id="auth-action-btn" class="auth-btn" onclick="handleAuth()">Login</button>
            <button id="auth-switch-btn" class="auth-toggle" onclick="toggleAuthMode()">Request Access (Sign Up)</button>
            <div id="auth-error" style="color: var(--accent); font-size: 0.8rem; margin-top: 10px; text-align: center;"></div>
        </div>
    </div>

    <div id="app-view">
        <div id="sidebar">
            <div class="sidebar-header">
                <h2>Archives</h2>
                <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">LGT</button>
            </div>
            <div id="history-list"></div>
            <button id="logout-btn" onclick="logout()">Terminate Session</button>
        </div>

        <div id="workspace">
            <div id="control-deck">
                <div class="input-row">
                    <input type="text" id="topic-input" placeholder="DEFINE INTELLIGENCE TARGET (e.g., Eurofighter Typhoon budget cuts 2026, 1500 words)..." autocomplete="off">
                    <button id="execute-btn" onclick="executeGeneration()">Initialize</button>
                </div>
                <div id="status-ticker" style="visibility: hidden;">
                    <span id="status-text">STANDING BY</span><span class="blinking-cursor"></span>
                </div>
            </div>

            <div id="content-viewport">
                <div style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); font-family: 'JetBrains Mono'; text-transform: uppercase; text-align: center;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 20px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="2" x2="12" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                    </svg>
                    <p>Awaiting Target Parameters.<br>System ready for deep temporal extraction.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>

    <script>
        // ==========================================
        // 1. SUPABASE CONFIGURATION (REPLACE THESE!)
        // ==========================================
        const SUPABASE_URL = "https://ddycdvmqonjvurxeaeht.supabase.co"; // e.g., https://xyz.supabase.co

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeWNkdm1xb25qdnVyeGVhZWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4Nzg3NTUsImV4cCI6MjA5NTQ1NDc1NX0.8GWqwtrn2duPQ6VKOEXoWnT_i2NQz1yBNDO2WW-UNbg"; // The public anon key

        // FIX 1: Renamed this variable to 'supaClient' so it doesn't crash
        const supaClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let sessionToken = null;
        let isSignUpMode = false;
        let currentReportId = null;

        // ==========================================
        // 2. AUTHENTICATION LOGIC
        // ==========================================
        async function checkSession() {
            // FIX 2: Updated to supaClient
            const { data, error } = await supaClient.auth.getSession();
            if (data.session) {
                sessionToken = data.session.access_token;
                showApp();
                loadHistory();
            }
        }
        checkSession();

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-action-btn').innerText = isSignUpMode ? "Register" : "Login";
            document.getElementById('auth-switch-btn').innerText = isSignUpMode ? "Existing Operative? Login" : "Request Access (Sign Up)";
            document.getElementById('auth-error').innerText = "";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.innerText = "Processing...";

            try {
                let result;
                if (isSignUpMode) {
                    // FIX 3: Updated to supaClient
                    result = await supaClient.auth.signUp({ email, password });
                    if (result.data.user && !result.data.session) {
                        errorDiv.innerText = "Check email for verification link.";
                        return;
                    }
                } else {
                    // FIX 4: Updated to supaClient
                    result = await supaClient.auth.signInWithPassword({ email, password });
                }

                if (result.error) throw result.error;

                sessionToken = result.data.session.access_token;
                showApp();
                loadHistory();
            } catch (err) {
                errorDiv.innerText = err.message;
            }
        }

        async function logout() {
            // FIX 5: Updated to supaClient
            await supaClient.auth.signOut();
            sessionToken = null;
            document.getElementById('app-view').style.display = 'none';
            document.getElementById('auth-view').style.display = 'flex';
        }

        function showApp() {
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'flex';
        }

        // ==========================================
        // 3. THEME & UI LOGIC
        // ==========================================
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            const btn = document.getElementById('theme-btn');
            btn.innerText = body.classList.contains('dark-mode') ? 'DRK' : 'LGT';
        }

        const phases = [
            "CALCULATING TEMPORAL VECTORS...",
            "DEPLOYING REGIONAL SCRAPERS...",
            "EXTRACTING RAW DATA...",
            "70B BRAIN OUTLINING...",
            "8B INSTANT DRAFTING CHAPTERS..."
        ];
        let tickerInterval;

        function startTicker() {
            const ticker = document.getElementById('status-ticker');
            const text = document.getElementById('status-text');
            ticker.style.visibility = 'visible';
            let i = 0;
            text.innerText = phases[0];
            tickerInterval = setInterval(() => {
                i = (i + 1) % phases.length;
                text.innerText = phases[i];
            }, 3500);
        }

        function stopTicker() {
            clearInterval(tickerInterval);
            document.getElementById('status-ticker').style.visibility = 'hidden';
        }

        // ==========================================
        // 4. API COMMUNICATION (FASTAPI)
        // ==========================================
        const API_BASE = "https://defence-report-ai.onrender.com";

        async function loadHistory() {
            try {
                const res = await fetch(`${API_BASE}/reports`, {
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
                if (!res.ok) throw new Error("Failed to load history");
                const reports = await res.json();

                const list = document.getElementById('history-list');
                list.innerHTML = '';
                reports.forEach(r => {
                    const btn = document.createElement('button');
                    btn.className = 'history-item';
                    const date = new Date(r.created_at).toLocaleDateString();
                    btn.innerText = `[${date}] ${r.title}`;
                    btn.onclick = () => fetchAndDisplayReport(r.id, btn);
                    list.appendChild(btn);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function executeGeneration() {
            const input = document.getElementById('topic-input');
            const topic = input.value.trim();
            if (!topic) return;

            const btn = document.getElementById('execute-btn');
            const viewport = document.getElementById('content-viewport');

            btn.disabled = true;
            viewport.classList.add('loading-overlay');
            startTicker();

            try {
                const res = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionToken}`
                    },
                    body: JSON.stringify({ topic })
                });

                if (!res.ok) throw new Error("API Error");
                const newReport = await res.json();

                input.value = '';
                loadHistory(); // Refresh sidebar
                renderReport(newReport);
            } catch (err) {
                alert("Execution failed. Check backend logs or token limits.");
            } finally {
                btn.disabled = false;
                viewport.classList.remove('loading-overlay');
                stopTicker();
            }
        }

        async function fetchAndDisplayReport(id, btnElement) {
            // Update active state in sidebar
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            try {
                const res = await fetch(`${API_BASE}/reports/${id}`, {
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
                const report = await res.json();
                renderReport(report);
            } catch (err) {
                alert("Failed to load report data.");
            }
        }

        function renderReport(report) {
            currentReportId = report.id;
            const viewport = document.getElementById('content-viewport');

            const dateStr = new Date(report.created_at || Date.now()).toLocaleString();

            let html = `
    <h1>${report.title}</h1>
    <div class="meta-bar">
        <span>TARGET: ${report.topic || 'Archived'}</span>
        <span>WORDS: ${report.word_count || 'N/A'}</span>
        <span>TS: ${dateStr}</span>
    </div>
    ${marked.parse(report.content)}

    <div class="action-bar">
        <button class="action-btn" onclick="downloadDocx('${report.id}')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            DOWNLOAD .DOCX
        </button>
        <button class="action-btn" onclick="deleteReport('${report.id}')"
            style="color: var(--accent); border-color: var(--accent);">
            DELETE RECORD
        </button>
    </div>
    `;
            viewport.innerHTML = html;
            viewport.scrollTo(0, 0);
        }

        async function downloadDocx(id) {
